services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxy_manager_server
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    depends_on:
      - main_db
      # - cache_db
    volumes:
      - ./backend:/app
    restart: always

  # frontend:
  #   build:
