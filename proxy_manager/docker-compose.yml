  #   restart: unless-stopped
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules

  main_db:
    image: postgres:15
    container_name: main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.dev
    restart: always

